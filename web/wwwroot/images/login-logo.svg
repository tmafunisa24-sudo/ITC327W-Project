<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 120">
  <!-- Laptop Icon -->
  <g transform="translate(20, 15)">
    <!-- Laptop screen -->
    <rect x="0" y="0" width="70" height="52" rx="3" fill="none" stroke="#1E7FFF" stroke-width="4"/>
    <!-- Laptop base -->
    <path d="M 5 52 L 8 65 L 62 65 L 65 52 Z" fill="none" stroke="#1E7FFF" stroke-width="4" stroke-linejoin="round"/>
    <!-- Cursor/Arrow pointer on screen -->
    <g transform="translate(35, 26)">
      <path d="M 0 0 L 12 14 L 6 16 L 8 22 L 2 20 L 0 26 Z" fill="#1E7FFF"/>
    </g>
  </g>
  
  <!-- Smartphone Icon -->
  <g transform="translate(145, 20)">
    <!-- Phone body -->
    <rect x="0" y="0" width="48" height="80" rx="6" fill="none" stroke="#2D3748" stroke-width="3.5"/>
    <!-- Phone screen -->
    <rect x="4" y="4" width="40" height="64" rx="2" fill="none" stroke="#2D3748" stroke-width="2.5"/>
    <!-- Home button -->
    <circle cx="24" cy="74" r="2.5" fill="#2D3748"/>
  </g>
</svg>
