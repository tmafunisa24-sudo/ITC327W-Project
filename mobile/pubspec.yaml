name: clicks_computers_and_accessories_servicehub_flutter
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Fonts
  google_fonts: ^6.2.1
  # HTTP + cookies
  dio: ^5.7.0
  dio_cookie_manager: ^3.1.1
  cookie_jar: ^4.0.8
  path_provider: ^2.1.4
  share_plus: ^10.1.0

  # State management
  provider: ^6.1.2

  # Routing
  go_router: ^14.2.0

  # Date formatting
  intl: ^0.19.0

  # Image picker
  image_picker: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true

  assets:
    - assets/images/
